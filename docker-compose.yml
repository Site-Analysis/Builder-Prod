# Builder-Prod — local dev stack
# Runs Keycloak + cadastral backend. Frontend runs outside Docker (npm run dev).
#
# Required env vars (set in .env at repo root):
#   KEYCLOAK_ADMIN_PASSWORD  — Keycloak admin console password (set before first run)
#   CADASTRAL_DATA_ROOT      — host path to dir containing cadastral_lake_v2/ + echawadi_village_list.json
# survey_index.db lives in Docker named volume (survey_index_vol) for fast WSL2 I/O.

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    ports:
      - "8180:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
      KC_DB: dev-file
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./infra/keycloak/sat-realm.json:/opt/keycloak/data/import/sat-realm.json:ro
      - keycloak_data:/opt/keycloak/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8080' 2>/dev/null && echo ok || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  cadastral:
    image: tanmaycj/cadastral:latest
    ports:
      - "8011:8011"
    environment:
      FLAGS: feature.cadastral.land-records
      CADASTRAL_DATA_DIR: /data/cadastral_lake_v2
      SURVEY_INDEX_DB: /survey_index/survey_index.db
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-sat}
      # tokens are accepted only when issued to this client (azp); required at start-up
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-sat-web}
      CORS_ORIGINS: '["http://localhost:3000","https://builder.qnit.site"]'
      # skip JWT validation locally: set BOTH (the bypass is refused unless APP_ENV=local)
      # APP_ENV: local
      # DEV_BYPASS_AUTH: "1"
    volumes:
      - ${CADASTRAL_DATA_ROOT}:/data:ro
      - survey_index_vol:/survey_index
    depends_on:
      keycloak:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8011/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  keycloak_data:
  survey_index_vol:
