# Builder-Prod — local dev stack
# Runs Keycloak + cadastral + planning backends. Frontend runs outside Docker (npm run dev).
#
# Required env vars (set in .env at repo root):
#   KEYCLOAK_ADMIN_PASSWORD  — Keycloak admin console password (set before first run)
#   CADASTRAL_DATA_ROOT      — host path to dir containing cadastral_lake_v2/ + echawadi_village_list.json
# The planning service keeps no data on disk: it reads infra/planning (register + layer_index.json)
# and extracts plan sheets on demand from their source URLs (contract 1.18+). The map's zone layers
# are pre-drawn tiles in Supabase Storage (bucket planning-tiles), read by the web app directly.
# survey_index.db lives in Docker named volume (survey_index_vol) for fast WSL2 I/O.

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    ports:
      - "8180:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
      KC_DB: dev-file
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./infra/keycloak/sat-realm.json:/opt/keycloak/data/import/sat-realm.json:ro
      - keycloak_data:/opt/keycloak/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8080' 2>/dev/null && echo ok || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  cadastral:
    build: services/cadastral
    ports:
      - "8011:8011"
    environment:
      FLAGS: feature.cadastral.land-records
      CADASTRAL_DATA_DIR: /data/cadastral_lake_v2
      SURVEY_INDEX_DB: /survey_index/survey_index.db
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-sat}
      CORS_ORIGINS: '["http://localhost:3000","https://builder.qnit.site"]'
      # DEV_BYPASS_AUTH: "1"   # uncomment to skip JWT validation locally
    volumes:
      - ${CADASTRAL_DATA_ROOT}:/data:ro
      - survey_index_vol:/survey_index
    depends_on:
      keycloak:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8011/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  planning:
    build: services/planning
    ports:
      - "8012:8012"
    environment:
      FLAGS: >-
        feature.planning.layers feature.planning.coverage-layer
        feature.planning.plan.BDA-RMP2031 feature.planning.plan.BMRDA-HSK-MP2031
        feature.planning.plan.BMRDA-ANK-MP2031
      PLANNING_REGISTER_DIR: /register
      # sheet extraction runs in a capped worker subprocess (infra/scripts/planning)
      PLANNING_WORKER_PYTHON: python
      PLANNING_WORKER_SCRIPT: /worker/sheet_worker.py
      CADASTRAL_URL: http://cadastral:8011
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-sat}
      CORS_ORIGINS: '["http://localhost:3000","https://builder.qnit.site"]'
      # DEV_BYPASS_AUTH: "1"   # uncomment to skip JWT validation locally
    volumes:
      - ./infra/planning:/register:ro
      - ./infra/scripts/planning:/worker:ro
    depends_on:
      cadastral:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8012/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  keycloak_data:
  survey_index_vol:
