# Builder-Prod — local dev stack
# Runs the cadastral backend. Frontend runs outside Docker (npm run dev).
#
# Required env vars (set in .env at repo root):
#   CADASTRAL_DATA_ROOT  — host path to the directory containing
#                          cadastral_lake_v2/ and echawadi_village_list.json
#   SURVEY_INDEX_PATH    — host path to a writable directory for survey_index.db

services:
  cadastral:
    build: services/cadastral
    ports:
      - "8011:8011"
    environment:
      FLAGS: feature.cadastral.land-records
      CADASTRAL_DATA_DIR: /data/cadastral_lake_v2
      SURVEY_INDEX_DB: /survey_index/survey_index.db
      KEYCLOAK_URL: ${KEYCLOAK_URL:-https://auth.builder.qnit.site}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-sat}
      CORS_ORIGINS: '["http://localhost:3000","https://builder.qnit.site"]'
      # DEV_BYPASS_AUTH: "1"   # uncomment to skip JWT validation locally
    volumes:
      - ${CADASTRAL_DATA_ROOT}:/data:ro
      - ${SURVEY_INDEX_PATH:-./data/survey_index}:/survey_index
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8011/health"]
      interval: 30s
      timeout: 10s
      retries: 3
