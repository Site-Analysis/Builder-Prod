name: ci

on:
  push:
    branches: [main, Cadestral]
  pull_request:

jobs:
  # ── Secret scan (all PRs) ─────────────────────────────────────────────────
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz
          sudo mv gitleaks /usr/local/bin/gitleaks
      - name: Run gitleaks
        run: gitleaks detect --source . --verbose --redact

  # ── JavaScript / TypeScript lint (when apps/web changes) ─────────────────
  lint-js:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'pull_request' &&
      contains(toJson(github.event.pull_request.changed_files), 'apps/web')
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npx eslint . --max-warnings=0
      - name: TypeScript
        run: npx tsc --noEmit

  # ── Python lint (when services/ changes) ──────────────────────────────────
  lint-py:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'pull_request' &&
      contains(toJson(github.event.pull_request.changed_files), 'services/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: ruff check
        run: ruff check services/
      - name: ruff format
        run: ruff format --check services/

  # ── Smoke tests (when services/cadastral changes) ─────────────────────────
  smoke-tests:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'pull_request' &&
      contains(toJson(github.event.pull_request.changed_files), 'services/cadastral')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install cadastral deps
        working-directory: services/cadastral
        run: pip install -r requirements.txt pytest
      - name: Run cadastral smoke tests
        env:
          FLAGS: feature.cadastral.land-records
        run: pytest tests/cadastral_smoke.py -v

  # ── Changelog guard (when contracts/ changes) ─────────────────────────────
  changelog-guard:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'pull_request' &&
      contains(toJson(github.event.pull_request.changed_files), 'contracts/')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require CHANGELOG.md in diff
        run: |
          if ! git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q 'contracts/CHANGELOG.md'; then
            echo "ERROR: contracts/ changed but contracts/CHANGELOG.md not updated."
            exit 1
          fi
