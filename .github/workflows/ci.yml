name: ci

on:
  push:
    branches: [main, Cadestral]
  pull_request:

jobs:
  # ── Secret scan (all PRs) ─────────────────────────────────────────────────
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz
          sudo mv gitleaks /usr/local/bin/gitleaks
      - name: Run gitleaks
        run: gitleaks detect --source . --verbose --redact

  # ── JavaScript / TypeScript typecheck ────────────────────────────────────
  lint-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install deps
        run: npm ci
      - name: TypeScript
        working-directory: apps/web
        run: ../../node_modules/.bin/tsc --noEmit

  # ── Python lint ───────────────────────────────────────────────────────────
  lint-py:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: ruff check
        run: ruff check services/
      - name: ruff format
        run: ruff format --check services/

  # ── Smoke tests ───────────────────────────────────────────────────────────
  smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install cadastral deps
        working-directory: services/cadastral
        run: pip install -r requirements.txt pytest
      - name: Run cadastral smoke tests
        env:
          FLAGS: feature.cadastral.land-records
        run: pytest tests/cadastral_smoke.py -v

  # ── Changelog guard ───────────────────────────────────────────────────────
  changelog-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require CHANGELOG.md in diff when contracts/ changed
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          if echo "$CHANGED" | grep -q '^contracts/' && ! echo "$CHANGED" | grep -q 'contracts/CHANGELOG.md'; then
            echo "ERROR: contracts/ changed but contracts/CHANGELOG.md not updated."
            exit 1
          fi
