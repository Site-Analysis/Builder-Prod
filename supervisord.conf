[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

[program:cadastral]
command=uvicorn app.main:app --host 0.0.0.0 --port 8011 --workers 1
directory=/app/cadastral
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:web]
command=node apps/web/server.js
directory=/app/web
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
