server {
    listen 80;
    server_name auth.builder.qnit.site api.builder.qnit.site;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name auth.builder.qnit.site;
    ssl_certificate     /etc/letsencrypt/live/auth.builder.qnit.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.builder.qnit.site/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    client_max_body_size 10m;
    location / {
        proxy_pass         http://keycloak:8080;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_buffer_size  128k;
        proxy_buffers      4 256k;
        proxy_busy_buffers_size 256k;
        proxy_read_timeout 120s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
    }
}

server {
    listen 443 ssl;
    server_name api.builder.qnit.site;
    ssl_certificate     /etc/letsencrypt/live/auth.builder.qnit.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.builder.qnit.site/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    location / {
        proxy_pass         http://cadastral:8011;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
