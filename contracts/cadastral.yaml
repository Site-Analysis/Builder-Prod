openapi: "3.1.0"
info:
  title: Cadastral Service
  version: "1.0.0"
  description: >
    Karnataka e-Chawadi (Bhoomi) cadastral data service. Exposes parcel geometries
    and administrative hierarchy (district / taluk / hobli / village). All parcel
    geometry is EPSG:4326 (WGS84). Source parquets store EPSG:32643 with X/Y swapped —
    the service fixes this at read time via affine transform.

    Gated by `feature.cadastral.land-records`.

servers:
  - url: http://localhost:8011
    description: Local dev

paths:
  /health:
    get:
      operationId: healthCheck
      summary: Health check
      responses:
        "200":
          description: Service running
          content:
            application/json:
              schema:
                type: object
                required: [status, service]
                properties:
                  status: { type: string, example: "ok" }
                  service: { type: string, example: "cadastral" }

  /search:
    get:
      operationId: searchSurveyNumber
      summary: Survey number prefix search (max 25 results)
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2 }
          description: Survey number prefix (e.g. "309")
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SurveySearchResult"
        "403":
          description: Feature flag disabled

  /districts:
    get:
      operationId: listDistricts
      summary: Districts with human-readable names
      responses:
        "200":
          description: Sorted list of {code, name} objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HierarchyItem"
        "403":
          description: Feature flag disabled

  /taluks:
    get:
      operationId: listTaluks
      summary: Taluks for a given district
      parameters:
        - { name: dist, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Sorted list of {code, name} objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HierarchyItem"
        "403":
          description: Feature flag disabled

  /hoblis:
    get:
      operationId: listHoblis
      summary: Hoblis for a given district + taluk
      parameters:
        - { name: dist,  in: query, required: true, schema: { type: string } }
        - { name: taluk, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Sorted list of {code, name} objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HierarchyItem"
        "403":
          description: Feature flag disabled

  /villages:
    get:
      operationId: listVillages
      summary: Villages for a given district + taluk + hobli
      parameters:
        - { name: dist,  in: query, required: true, schema: { type: string } }
        - { name: taluk, in: query, required: true, schema: { type: string } }
        - { name: hobli, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Sorted list of {code, name} objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HierarchyItem"
        "403":
          description: Feature flag disabled

  /data:
    get:
      operationId: getParcelData
      summary: Parcel polygon GeoJSON for a village
      description: >
        Returns GeoJSON FeatureCollection of survey parcels. Provide all four hierarchy
        params — unscoped calls load the full 1.7 GB lake.
        Gated by `feature.cadastral.land-records`.
      parameters:
        - { name: dist,   in: query, required: false, schema: { type: string } }
        - { name: taluk,  in: query, required: false, schema: { type: string } }
        - { name: hobli,  in: query, required: false, schema: { type: string } }
        - { name: vlg,    in: query, required: false, schema: { type: string } }
        - { name: survey, in: query, required: false, schema: { type: string }, description: "Filter to exact survey_no" }
      responses:
        "200":
          description: GeoJSON FeatureCollection of parcels
          content:
            application/json:
              schema:
                type: object
                description: GeoJSON FeatureCollection
        "403":
          description: Feature flag disabled

  /boundary:
    get:
      operationId: getVillageBoundary
      summary: Derived village boundary polygon (union of all parcels in village)
      description: >
        Returns a GeoJSON FeatureCollection containing a single Polygon/MultiPolygon
        feature representing the boundary of the specified village, derived by computing
        the union of all parcel geometries. Gated by `feature.cadastral.land-records`.
      parameters:
        - { name: dist,  in: query, required: true, schema: { type: string } }
        - { name: taluk, in: query, required: true, schema: { type: string } }
        - { name: hobli, in: query, required: true, schema: { type: string } }
        - { name: vlg,   in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: GeoJSON FeatureCollection with one polygon feature
          content:
            application/json:
              schema:
                type: object
                description: GeoJSON FeatureCollection
        "403":
          description: Feature flag disabled

  /nearby:
    get:
      operationId: getNearbyVillages
      summary: LGD villages within a geographic radius of a point
      description: >
        Returns a GeoJSON FeatureCollection of all LGD villages whose centroid is within
        `radius_km` of the given WGS84 point. Geometry from `lgd_villages.parquet`.
        `has_data: true` = cadastral parcel data exists; `has_data: false` = LGD-only.
        Feature properties include `lgd_code`, `village_name`, `has_data`, and when the
        village is mapped to the e-Chawadi hierarchy: `dist`, `taluk`, `hobli`, `vlg`
        (e-Chawadi string codes, null if unmapped). Use `dist`/`taluk`/`hobli`/`vlg`
        to auto-load parcels after a coordinate search.
        Centroid index built in background at startup — returns empty FeatureCollection if
        not yet ready. Gated by `feature.cadastral.land-records`.
      parameters:
        - { name: lat,       in: query, required: true,  schema: { type: number } }
        - { name: lng,       in: query, required: true,  schema: { type: number } }
        - { name: radius_km, in: query, required: false, schema: { type: number, default: 5.0, minimum: 0.1, maximum: 50.0 } }
      responses:
        "200":
          description: GeoJSON FeatureCollection — one polygon per nearby village
          content:
            application/json:
              schema:
                type: object
                description: GeoJSON FeatureCollection
        "403":
          description: Feature flag disabled

  /boundaries:
    get:
      operationId: getHobliBoundaries
      summary: All village boundary polygons within a hobli (for nearby overlay)
      description: >
        Returns a GeoJSON FeatureCollection with one feature per LGD village in the hobli.
        `has_data: true` = cadastral parcel data exists; `has_data: false` = LGD village only.
        When `feature.cadastral.lgd-boundaries` is active and `lgd_villages.parquet` +
        `village_roster.db` are present, geometry is sourced from the official LGD boundary
        dataset for ALL villages (green and red). Fallback (flag off or files absent):
        green villages use parcel union geometry, red villages have `geometry: null`.
        Properties always include `village_code`, `village_name`, and `has_data`.
        Gated by `feature.cadastral.land-records`.
      parameters:
        - { name: dist,  in: query, required: true, schema: { type: string } }
        - { name: taluk, in: query, required: true, schema: { type: string } }
        - { name: hobli, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: GeoJSON FeatureCollection — one polygon per village in hobli
          content:
            application/json:
              schema:
                type: object
                description: GeoJSON FeatureCollection
        "403":
          description: Feature flag disabled

  /village-search:
    get:
      operationId: searchVillages
      summary: Village name prefix search (cadastral data only)
      description: >
        In-memory prefix search across all villages that have cadastral parquet data.
        Returns up to 20 matches sorted alphabetically. Case-insensitive.
        Index built in background at startup (~5-10s) — returns empty array until ready.
        Gated by `feature.cadastral.land-records`.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2 }
          description: Village name prefix (case-insensitive)
      responses:
        "200":
          description: Villages with parquet data matching prefix
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VillageSearchResult"
        "403":
          description: Feature flag disabled

components:
  schemas:
    HierarchyItem:
      type: object
      required: [code, name]
      properties:
        code: { type: string }
        name: { type: string }

    SurveySearchResult:
      type: object
      required: [survey_no, village_name, dist, taluk, hobli, vlg]
      properties:
        survey_no:    { type: string, example: "309/*/*" }
        village_name: { type: string, example: "Krishnarajapura" }
        dist:         { type: string, example: "1" }
        taluk:        { type: string, example: "9" }
        hobli:        { type: string, example: "3" }
        vlg:          { type: string, example: "46" }

    VillageSearchResult:
      type: object
      required: [village_name, dist, taluk, hobli, vlg, dist_name, taluk_name]
      properties:
        village_name: { type: string, example: "HEBBALA" }
        dist:         { type: string, example: "20" }
        taluk:        { type: string, example: "1" }
        hobli:        { type: string, example: "2" }
        vlg:          { type: string, example: "18" }
        dist_name:    { type: string, example: "BENGALURU" }
        taluk_name:   { type: string, example: "BANGALORE-NORTH" }
